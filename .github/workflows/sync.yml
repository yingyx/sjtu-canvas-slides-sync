name: Canvas Auto Sync

on:
  schedule:
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Sync all semesters or only the latest'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Install LibreOffice
        run: |
          sudo apt update
          sudo apt install -y libreoffice

      - name: Run Sync
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          SMH_USER_TOKEN: ${{ secrets.SMH_USER_TOKEN }}
          CONVERT_PPT_TO_PDF: "true"
        run: |
          SYNC_ALL_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.sync_all }}" = "true" ]; then
            SYNC_ALL_FLAG="--sync-all"
          fi
          python src/main.py $SYNC_ALL_FLAG
          if [ $? -eq 0 ]; then
            echo "$(date)" > last_update.txt
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add last_update.txt
            git commit -m "Update sync timestamp" || echo "No changes to commit"
            git push
          fi